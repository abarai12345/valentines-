<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Simran 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', Arial, sans-serif;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
  }

  .container {
    z-index: 2;
    padding: 20px;
    width: 100%;
    max-width: 400px;
  }

  h1 {
    color: #fff;
    font-size: 2rem;
    margin-bottom: 30px;
    animation: fadeIn 2s ease;
  }

  .buttons {
    position: relative;
    width: 100%;
    height: 200px;
  }

  button {
    position: absolute;
    padding: 15px 25px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    left: 20%;
    bottom: 20px;
  }

  #no {
    background: #6c757d;
    color: white;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: float 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-110vh); }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Simran Thobhani,<br>will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 💔</button>
  </div>
</div>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-love.mp3"></audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const music = document.getElementById("music");
let yesScale = 1.1;

// YES button clicked
yesBtn.addEventListener("click", () => {
  music.play();

  document.body.innerHTML = `
    <div style="color:white; text-align:center; padding:40px; animation: fadeIn 2s;">
      <h1>YAYYYY 💕🥰</h1>
      <h2>Simran, you just made me the happiest person ❤️</h2>
      <p style="font-size:1.3rem; margin-top:30px; line-height:1.6;">
        I love you ❤️<br><br>
        From your amazing and one of a kind man,<br>
        <strong>Aaron x</strong>
      </p>
    </div>
  `;

  setInterval(createHeart, 250);
});

// Hearts animation
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

// NO button floating freely
let noX = Math.random() * (window.innerWidth - 100);
let noY = Math.random() * (window.innerHeight - 50);
let speedX = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);
let speedY = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);

function animateNo() {
  noX += speedX;
  noY += speedY;

  // Bounce off edges
  if(noX < 0 || noX > window.innerWidth - noBtn.offsetWidth) speedX *= -1;
  if(noY < 0 || noY > window.innerHeight - noBtn.offsetHeight) speedY *= -1;

  noBtn.style.left = noX + "px";
  noBtn.style.top = noY + "px";

  // Avoid mouse
  document.onmousemove = function(e) {
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    const dx = mouseX - (noX + noBtn.offsetWidth/2);
    const dy = mouseY - (noY + noBtn.offsetHeight/2);
    const distance = Math.sqrt(dx*dx + dy*dy);

    if(distance < 100) { // sprint away if mouse is close
      speedX = -speedX + (Math.random()*2 -1);
      speedY = -speedY + (Math.random()*2 -1);
    }
  };

  requestAnimationFrame(animateNo);
}

// Start NO button animation
animateNo();
</script>

</body>
</html>
